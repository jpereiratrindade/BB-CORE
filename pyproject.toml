[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-core"
version = "0.1.0"
description = "Memória de insights com proveniência verificável e MCP"
requires-python = ">=3.11"

[project.scripts]
bbcore = "bbcore.server:main"

[tool.setuptools.packages.find]
include = ["bbcore*"]
